[project]
name = "medclue"
version = "0.1.0"
description = "Android app to identify medications from photos and manage a personal medicine cabinet."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Aiala Elejalde", email = "elejalde46@gmail.com" }
]
dependencies = [
    "flet>=1.0.5",
    "httpx==0.28.1",
    "flet-camera==1.0.5",
    "flet-permission-handler==1.0.5",
    "Pillow==12.2.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.aialaelejalde"
product = "MedClue"
company = "Aiala Elejalde"
copyright = "Copyright (C) 2026 Aiala Elejalde"

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#FFFFFF"
dark_color = "#FFFFFF"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
theme_mode = "light"
bgcolor_light = "#FFFFFF"

[tool.flet.android]
adaptive_icon_background = "#FFFFFF"

[tool.flet.android.permission]
"android.permission.CAMERA" = true
