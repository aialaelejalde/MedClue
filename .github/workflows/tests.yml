name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      MEDCLUE_BACKEND_URL: https://backend.example.invalid
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as file:
              config = tomllib.load(file)
          dependencies = config["project"]["dependencies"]
          dependencies += [
              item for item in config["dependency-groups"]["dev"]
              if item.startswith("pytest")
          ]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY

      - name: Run tests
        run: python -m pytest tests -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q
